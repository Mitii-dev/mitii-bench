id: "frontend-stepper-indicator-next"
title: "Stepper Indicator Component"
ecosystem: "js"
starter: "next-js"
family: "frontend"
packages: []
difficulty: "easy"
category: "frontend"
language: "javascript"
tags:
  - "stepper"
  - "progress"
  - "wizard"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"stepper\""
  - contains:
      file: "app/page.jsx"
      text: "step-node-"
  - contains:
      file: "app/page.jsx"
      text: "completed"
  - contains:
      file: "app/page.jsx"
      text: "active"
  - contains:
      file: "app/page.jsx"
      text: "pending"
