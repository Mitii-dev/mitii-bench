  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"mention-dropdown\""
  - contains:
      file: "app/page.jsx"
      text: "@"
  - contains:
      file: "app/page.jsx"
      text: "mention-dropdown"
  - contains:
      file: "app/page.jsx"
      text: "USERS"
