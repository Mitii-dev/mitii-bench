id: "frontend-markdown-previewer-react"
title: "Markdown Live Editor & Previewer"
ecosystem: "js"
starter: "react-js"
family: "frontend"
packages: []
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "markdown"
  - "preview"
  - "editor"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"markdown-input\""
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"markdown-preview\""
  - contains:
      file: "src/App.jsx"
      text: "# "
  - contains:
      file: "src/App.jsx"
      text: "**"
  - contains:
      file: "src/App.jsx"
      text: "- "
  - contains:
      file: "src/App.jsx"
      text: "dangerouslySetInnerHTML"
