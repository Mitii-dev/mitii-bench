ecosystem: "js"
starter: "react-js"
family: "frontend"
packages:
  - "@reduxjs/toolkit"
  - "react-redux"
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "ecosystem-lib"
  - "redux"
  - "state"
  - "react-tasks"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
