  - contains:
      file: "src/App.jsx"
      text: 'data-testid="add-to-cart-btn"'
  - contains:
      file: "src/App.jsx"
      text: "@reduxjs/toolkit"
  - contains:
      file: "src/App.jsx"
      text: "createSlice"
  - contains:
      file: "src/App.jsx"
      text: "react-redux"
  - contains:
      file: "src/App.jsx"
      text: "removeItem"
