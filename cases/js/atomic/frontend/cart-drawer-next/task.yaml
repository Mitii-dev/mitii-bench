id: "frontend-cart-drawer-next"
title: "Shopping Cart Drawer (Slide-Over)"
ecosystem: "js"
starter: "next-js"
family: "frontend"
packages: []
difficulty: "easy"
category: "frontend"
language: "javascript"
tags:
  - "drawer"
  - "cart"
  - "slide-over"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"open-cart-btn\""
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"cart-drawer\""
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"close-cart-btn\""
  - contains:
      file: "app/page.jsx"
      text: "open-cart-btn"
  - contains:
      file: "app/page.jsx"
      text: "close-cart-btn"
  - contains:
      file: "app/page.jsx"
      text: "cart-drawer"
