id: "frontend-date-range-picker-next"
title: "Date Picker & Range Selector"
ecosystem: "js"
starter: "next-js"
family: "frontend"
packages: []
difficulty: "easy"
category: "frontend"
language: "javascript"
tags:
  - "date"
  - "validation"
  - "range"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"start-date\""
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"end-date\""
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"date-error\""
  - contains:
      file: "app/page.jsx"
      text: "date-error"
  - contains:
      file: "app/page.jsx"
      text: "prior"
  - contains:
      file: "app/page.jsx"
      text: "End Date"
