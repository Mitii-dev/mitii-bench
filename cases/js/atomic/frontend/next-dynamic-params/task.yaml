id: "frontend-next-dynamic-params"
title: "Next.js App Router: Dynamic URL Parameters"
ecosystem: "js"
starter: "next-js"
family: "frontend"
packages: []
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "next-router"
  - "routing"
  - "params"
  - "react-tasks"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "app/products/[id]/page.js"
      text: 'data-testid="product-detail"'
  - contains:
      file: "app/products/[id]/page.js"
      text: "useParams"
  - contains:
      file: "app/products/[id]/page.js"
      text: "next/navigation"
  - contains:
      file: "app/products/[id]/page.js"
      text: "[id]"
  - exists:
      file: "app/products/[id]/page.js"
  - exists:
      file: "app/page.js"
  - exists:
      file: "tests/ui.test.jsx"
  - contains:
      file: "app/page.js"
      text: "/products/42"
