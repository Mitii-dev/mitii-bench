id: "frontend-accessible-modal-next"
title: "Modal Dialog with Keyboard Accessibility"
ecosystem: "js"
starter: "next-js"
family: "frontend"
packages: []
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "modal"
  - "a11y"
  - "focus-trap"
  - "keyboard"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"accessible-modal\""
  - contains:
      file: "app/page.jsx"
      text: "Escape"
  - contains:
      file: "app/page.jsx"
      text: "Tab"
  - contains:
      file: "app/page.jsx"
      text: "focus"
