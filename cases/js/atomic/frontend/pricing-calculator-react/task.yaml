id: "frontend-pricing-calculator-react"
title: "Interactive Pricing Calculator / Slider"
ecosystem: "js"
starter: "react-js"
family: "frontend"
packages: []
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "pricing"
  - "slider"
  - "calculator"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"user-slider\""
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"billing-toggle\""
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"calculated-price\""
  - contains:
      file: "src/App.jsx"
      text: "Monthly"
  - contains:
      file: "src/App.jsx"
      text: "Yearly"
  - contains:
      file: "src/App.jsx"
      text: "20%"
  - contains:
      file: "src/App.jsx"
      text: "calculated-price"
