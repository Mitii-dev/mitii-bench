      file: "src/App.jsx"
      text: 'data-testid="previous-value"'
  - contains:
      file: "src/App.jsx"
      text: 'data-testid="increment-button"'
  - contains:
      file: "src/App.jsx"
      text: 'data-testid="decrement-button"'
  - contains:
      file: "src/App.jsx"
      text: 'data-testid="reset-button"'
