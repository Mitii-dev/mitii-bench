id: "frontend-drag-drop-list-react"
title: "Drag and Drop List Reordering"
ecosystem: "js"
starter: "react-js"
family: "frontend"
packages: []
difficulty: "medium"
category: "frontend"
language: "javascript"

tags:
  - "react"
  - "drag-and-drop"
  - "list-reordering"
  - "state-management"
  - "react-tasks"
  - "vanilla"

timeoutSec: 300

promptFile: "prompt.md"
readmeFile: "README.md"

checks:
