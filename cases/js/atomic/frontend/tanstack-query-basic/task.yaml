      text: 'data-testid="rq-refetch-btn"'
  - contains:
      file: "src/App.jsx"
      text: "@tanstack/react-query"
  - contains:
      file: "src/App.jsx"
      text: "useQuery"
  - contains:
      file: "src/App.jsx"
      text: "QueryClientProvider"
  - contains:
      file: "src/App.jsx"
      text: "queryKey"
  - contains:
      file: "src/App.jsx"
      text: "queryFn"
  - contains:
      file: "src/App.jsx"
      text: "refetch()"
  - contains:
      file: "src/App.jsx"
