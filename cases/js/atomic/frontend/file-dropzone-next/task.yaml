ecosystem: "js"
starter: "next-js"
family: "frontend"
packages: []
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "drag-drop"
  - "files"
  - "upload"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
