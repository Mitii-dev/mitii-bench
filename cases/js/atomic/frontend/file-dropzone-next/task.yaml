  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"uploaded-file-list\""
  - contains:
      file: "app/page.jsx"
      text: "active"
  - contains:
      file: "app/page.jsx"
      text: "KB"
  - contains:
      file: "app/page.jsx"
      text: "onDragOver"
  - contains:
      file: "app/page.jsx"
      text: "onDrop"
