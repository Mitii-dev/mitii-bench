id: "frontend-audio-player-ui-next"
title: "Audio Player UI"
ecosystem: "js"
starter: "next-js"
family: "frontend"
packages: []
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "audio"
  - "player"
  - "controls"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"play-pause-btn\""
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"audio-progress\""
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"time-display\""
  - contains:
      file: "app/page.jsx"
      text: "Play"
  - contains:
      file: "app/page.jsx"
      text: "Pause"
  - contains:
      file: "app/page.jsx"
      text: "progress"
  - contains:
      file: "app/page.jsx"
      text: "padStart"
