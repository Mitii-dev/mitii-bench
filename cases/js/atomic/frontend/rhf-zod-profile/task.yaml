id: "frontend-rhf-zod-profile"
title: "React Hook Form + Zod Resolver"
ecosystem: "js"
starter: "react-js"
family: "frontend"
packages:
  - "react-hook-form"
  - "zod"
  - "@hookform/resolvers"
difficulty: "hard"
category: "frontend"
language: "javascript"
tags:
  - "ecosystem-lib"
  - "react-hook-form"
  - "zod"
  - "forms"
  - "react-tasks"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
