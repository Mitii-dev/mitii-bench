      text: 'data-testid="zod-error-list"'
  - contains:
      file: "src/App.jsx"
      text: "react-hook-form"
  - contains:
      file: "src/App.jsx"
      text: "zod"
  - contains:
      file: "src/App.jsx"
      text: "zodResolver"
  - contains:
      file: "src/App.jsx"
      text: "z.coerce.number"
  - contains:
      file: "src/App.jsx"
      text: "zodResolver(profileSchema)"
  - contains:
      file: "src/App.jsx"
      text: ".email("
  - contains:
      file: "src/App.jsx"
      text: ".min(18"
