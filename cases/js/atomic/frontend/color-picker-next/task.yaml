id: "frontend-color-picker-next"
title: "Color Picker Widget"
ecosystem: "js"
starter: "next-js"
family: "frontend"
packages: []
difficulty: "easy"
category: "frontend"
language: "javascript"
tags:
  - "color"
  - "picker"
  - "hex"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "app/page.jsx"
      text: "swatch-"
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"hex-input\""
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"color-preview\""
  - contains:
      file: "app/page.jsx"
      text: "#ff0000"
  - contains:
      file: "app/page.jsx"
      text: "hex-input"
  - contains:
      file: "app/page.jsx"
      text: "color-preview"
