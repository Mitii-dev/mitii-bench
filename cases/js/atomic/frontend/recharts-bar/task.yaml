ecosystem: "js"
starter: "react-js"
family: "frontend"
packages:
  - "recharts"
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "ecosystem-lib"
  - "recharts"
  - "charts"
  - "react-tasks"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
