id: "frontend-shadcn-radix-dialog"
title: "Shadcn UI / Radix Primitives: Dialog"
ecosystem: "js"
starter: "react-js"
family: "frontend"
packages:
  - "@radix-ui/react-dialog"
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "ecosystem-lib"
  - "radix"
  - "shadcn"
  - "dialog"
  - "a11y"
  - "react-tasks"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "src/App.jsx"
      text: 'data-testid="dialog-trigger"'
  - contains:
      file: "src/App.jsx"
      text: 'data-testid="dialog-content"'
  - contains:
      file: "src/App.jsx"
      text: 'data-testid="dialog-close"'
  - contains:
      file: "src/App.jsx"
      text: "@radix-ui/react-dialog"
  - contains:
      file: "src/App.jsx"
      text: "Dialog"
  - contains:
      file: "src/App.jsx"
      text: "Dialog.Title"
  - contains:
      file: "src/App.jsx"
      text: "Dialog.Description"
  - contains:
      file: "src/App.jsx"
      text: "Dialog.Portal"
