id: "frontend-image-carousel-next"
title: "Image Carousel / Gallery Slider"
ecosystem: "js"
starter: "next-js"
family: "frontend"
packages: []
difficulty: "easy"
category: "frontend"
language: "javascript"
tags:
  - "carousel"
  - "slider"
  - "images"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"carousel-image\""
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"carousel-prev\""
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"carousel-next\""
  - contains:
      file: "app/page.jsx"
      text: "carousel-dot-"
