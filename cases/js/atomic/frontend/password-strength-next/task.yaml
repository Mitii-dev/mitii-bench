id: "frontend-password-strength-next"
title: "Password Strength Meter"
ecosystem: "js"
starter: "next-js"
family: "frontend"
packages: []
difficulty: "easy"
category: "frontend"
language: "javascript"
tags:
  - "password"
  - "validation"
  - "meter"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"password-input\""
  - contains:
      file: "app/page.jsx"
      text: "data-testid=\"strength-meter\""
  - contains:
      file: "app/page.jsx"
      text: "Weak"
  - contains:
      file: "app/page.jsx"
      text: "Medium"
  - contains:
      file: "app/page.jsx"
      text: "Strong"
