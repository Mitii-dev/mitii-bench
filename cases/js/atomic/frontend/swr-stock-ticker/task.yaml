      file: "src/App.jsx"
      text: 'data-testid="swr-validating"'
  - contains:
      file: "src/App.jsx"
      text: "swr"
  - contains:
      file: "src/App.jsx"
      text: "useSWR"
  - contains:
      file: "src/App.jsx"
      text: "isValidating"
  - contains:
      file: "src/App.jsx"
      text: "refreshInterval"
  - contains:
      file: "src/App.jsx"
      text: "revalidateOnFocus"
  - contains:
      file: "src/App.jsx"
      text: "mutate()"
  - contains:
      file: "src/App.jsx"
      text: "Updating..."
