ecosystem: "js"
starter: "react-js"
family: "frontend"
packages:
  - "swr"
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "ecosystem-lib"
  - "swr"
  - "data-fetching"
  - "react-tasks"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
