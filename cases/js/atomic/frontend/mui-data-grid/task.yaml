id: "frontend-mui-data-grid"
title: "Material UI (MUI): Data Grid & Pagination"
ecosystem: "js"
starter: "react-js"
family: "frontend"
packages:
  - "@mui/material"
  - "@mui/x-data-grid"
  - "@emotion/react"
  - "@emotion/styled"
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "ecosystem-lib"
  - "mui"
  - "data-grid"
  - "pagination"
  - "react-tasks"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "src/App.jsx"
      text: 'data-testid="mui-data-grid"'
  - contains:
      file: "src/App.jsx"
      text: 'data-testid="grid-search"'
  - contains:
      file: "src/App.jsx"
      text: "@mui/x-data-grid"
  - contains:
      file: "src/App.jsx"
      text: "DataGrid"
  - contains:
      file: "src/App.jsx"
      text: "pageSizeOptions"
  - contains:
      file: "src/App.jsx"
      text: "pagination"
