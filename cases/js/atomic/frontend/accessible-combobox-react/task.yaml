id: "frontend-accessible-combobox-react"
title: "Accessible Combobox"
ecosystem: "js"
starter: "react-js"
family: "frontend"
packages: []
difficulty: "medium"
category: "frontend"
language: "javascript"
tags:
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"

checks:
