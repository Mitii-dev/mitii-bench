id: "frontend-login-form-react"
title: "Controlled Inputs & Form State"
ecosystem: "js"
starter: "react-js"
family: "frontend"
packages: []
difficulty: "easy"
category: "frontend"
language: "javascript"
tags:
  - "react"
  - "forms"
  - "controlled-inputs"
  - "react-tasks"
  - "vanilla"
  - "smoke"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"login-form\""
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"email-input\""
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"password-input\""
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"submit-btn\""
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"form-status\""
  - contains:
      file: "src/App.jsx"
      text: "Welcome,"
  - contains:
      file: "src/App.jsx"
      text: "Please fill all fields"
