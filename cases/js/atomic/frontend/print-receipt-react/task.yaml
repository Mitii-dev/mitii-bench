id: "frontend-print-receipt-react"
title: "Print-Friendly Receipt View"
ecosystem: "js"
starter: "react-js"
family: "frontend"
packages: []
difficulty: "easy"
category: "frontend"
language: "javascript"
tags:
  - "print"
  - "invoice"
  - "receipt"
  - "react-tasks"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "npm test -- tests/ui.test.jsx"
      timeoutMs: 60000
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"invoice-view\""
  - contains:
      file: "src/App.jsx"
      text: "data-testid=\"print-btn\""
  - contains:
      file: "src/App.jsx"
      text: "window.print"
  - contains:
      file: "src/App.jsx"
      text: "@media print"
