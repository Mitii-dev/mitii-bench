id: "backend-async-local-storage-request-id"
title: "Asynchronous Context Tracking (`AsyncLocalStorage`)"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "hard"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "core"
  - "vanilla"
  - "node-core"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/requestContext.js"
      text: "AsyncLocalStorage"
  - contains:
      file: "src/requestContext.js"
      text: "x-request-id"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 15000
      requests:
        - method: "GET"
          path: "/context"
          headers:
            x-request-id: "test-req-1"
          expect:
            status: 200
            jsonSubset:
              requestId: "test-req-1"
              message: "handled request"
            headers:
              x-request-id: "test-req-1"
