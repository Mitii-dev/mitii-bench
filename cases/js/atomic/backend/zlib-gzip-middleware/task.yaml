id: "backend-zlib-gzip-middleware"
title: "Zlib Compression Stream"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "core"
  - "vanilla"
  - "node-core"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/gzipMiddleware.js"
      text: "createGzip"
  - contains:
      file: "src/gzipMiddleware.js"
      text: "Accept-Encoding"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 15000
      requests:
        - method: "GET"
          path: "/data"
          headers:
            Accept-Encoding: "gzip"
          expect:
            status: 200
            headerContains:
              content-encoding: "gzip"
        - method: "GET"
          path: "/data"
          expect:
            status: 200
            jsonSubset:
              message: "hello"
