id: "backend-api-key-auth"
title: "Dynamic API Key Management System"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "X-API-Key"
  - contains:
      file: "src/index.js"
      text: "usage"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "POST"
          path: "/admin/keys"
          json:
            name: "ci"
          expect:
            status: 201
            jsonPaths:
              - "key"
