id: "backend-http-native-server"
title: "HTTP Server without Frameworks"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "easy"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "core"
  - "vanilla"
  - "node-core"
  - "smoke"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "createServer"
  - contains:
      file: "src/index.js"
      text: "/health"
  - contains:
      file: "src/index.js"
      text: "/echo"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 15000
      requests:
        - method: "GET"
          path: "/health"
          expect:
            status: 200
            jsonPaths:
              - "status"
              - "uptime"
            jsonSubset:
              status: "ok"
        - method: "POST"
          path: "/echo"
          json:
            hello: "world"
          expect:
            status: 200
            jsonSubset:
              hello: "world"
