id: "backend-express-cors-config"
title: "Express CORS Custom Configuration"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/corsMiddleware.js"
      text: "example.com"
  - contains:
      file: "src/corsMiddleware.js"
      text: "X-Total-Count"
  - contains:
      file: "src/corsMiddleware.js"
      text: "CORS"
  - http:
      start:
        command: "node src/index.js"
        env:
          ORIGIN: "https://app.example.com"
      timeoutMs: 15000
      requests:
        - method: "GET"
          path: "/data"
          headers:
            Origin: "https://shop.example.com"
          expect:
            status: 200
            headers:
              access-control-allow-origin: "https://shop.example.com"
            headerContains:
              access-control-expose-headers: "X-Total-Count"
