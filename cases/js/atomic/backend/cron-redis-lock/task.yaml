id: "backend-cron-redis-lock"
title: "Scheduled Cron Jobs with Locks"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "node-cron"
  - "redlock"
  - "ioredis"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "node-cron"
        - "redlock"
        - "ioredis"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "node-cron"
  - contains:
      file: "src/index.js"
      text: "redlock"
