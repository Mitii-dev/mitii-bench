id: "backend-graceful-http-teardown"
title: "Graceful HTTP Server Teardown"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "close"
  - contains:
      file: "src/index.js"
      text: "destroy"
  - contains:
      file: "src/index.js"
      text: "10000"
