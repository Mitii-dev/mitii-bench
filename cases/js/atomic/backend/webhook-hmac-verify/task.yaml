id: "backend-webhook-hmac-verify"
title: "Webhook Ingestion & Signature Verification"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "vanilla"
  - "smoke"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/webhook.js"
      text: "x-signature"
  - contains:
      file: "src/webhook.js"
      text: "createHmac"
  - contains:
      file: "src/webhook.js"
      text: "timingSafeEqual"
  - http:
      start:
        command: "node src/webhook.js"
        env:
          WEBHOOK_SECRET: "whsec_test"
      timeoutMs: 20000
      requests:
        - method: "POST"
          path: "/webhook"
          headers:
            x-signature: "deadbeef"
          json:
            event: "paid"
          expect:
            status: 401
        - method: "POST"
          path: "/webhook"
          headers:
            x-signature: "b85236760a6447cd065efe2b7bd10554c3744eff60cc53dfa47a639c5fd1e22c"
          json:
            event: "paid"
          expect:
            status: 200
            jsonSubset:
              received: true
