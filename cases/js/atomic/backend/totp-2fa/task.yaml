id: "backend-totp-2fa"
title: "Two-Factor Authentication (2FA) TOTP Service"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "speakeasy"
  - "qrcode"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "speakeasy"
        - "qrcode"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "/2fa/generate"
  - contains:
      file: "src/index.js"
      text: "/2fa/verify"
  - contains:
      file: "src/index.js"
      text: "speakeasy"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "POST"
          path: "/2fa/generate"
          json:
            userId: "u1"
          expect:
            status: 200
            jsonPaths:
              - "secret"
              - "qr"
