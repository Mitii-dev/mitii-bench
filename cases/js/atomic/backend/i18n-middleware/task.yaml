id: "backend-i18n-middleware"
title: "Multi-Language i18n Translation Middleware"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "Accept-Language"
  - contains:
      file: "src/index.js"
      text: "__"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "GET"
          path: "/hello"
          headers:
            Accept-Language: "fr"
          expect:
            status: 200
            jsonSubset:
              message: "Bonjour"
