id: "backend-health-liveness-readiness"
title: "Health Check & Liveness/Readiness Probes"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "vanilla"
  - "smoke"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "/health/liveness"
  - contains:
      file: "src/index.js"
      text: "/health/readiness"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "GET"
          path: "/health/liveness"
          expect:
            status: 200
            jsonSubset:
              alive: true
        - method: "GET"
          path: "/health/readiness"
          expect:
            status: 200
            jsonPaths:
              - "ready"
