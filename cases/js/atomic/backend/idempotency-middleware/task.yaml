id: "backend-idempotency-middleware"
title: "Distributed Idempotency Key Middleware"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "ioredis"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "ioredis"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "Idempotency-Key"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "POST"
          path: "/pay"
          headers:
            Idempotency-Key: "abc-1"
          json:
            amount: 10
          expect:
            status: 201
            jsonSubset:
              paid: true
