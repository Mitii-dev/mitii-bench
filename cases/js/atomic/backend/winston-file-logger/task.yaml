id: "backend-winston-file-logger"
title: "Winston Logger with File Transport"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "winston"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "winston"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/logger.js"
      text: "winston"
  - contains:
      file: "src/logger.js"
      text: "error.log"
  - contains:
      file: "src/logger.js"
      text: "combined.log"
