id: "backend-inverted-index-search"
title: "In-Memory Search Engine with Inverted Index"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/searchIndex.js"
      text: "TF-IDF"
  - contains:
      file: "src/searchIndex.js"
      text: "inverted"
