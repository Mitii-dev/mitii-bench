id: "backend-redis-cache-middleware"
title: "Redis Caching Middleware for Express"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "ioredis"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "ioredis"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/cacheMiddleware.js"
      text: "ioredis"
  - contains:
      file: "src/cacheMiddleware.js"
      text: "originalUrl"
  - contains:
      file: "src/cacheMiddleware.js"
      text: "setex"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 15000
      requests:
        - method: "GET"
          path: "/api/items"
          expect:
            status: 200
            headerContains:
              x-cache: "MISS"
        - method: "GET"
          path: "/api/items"
          expect:
            status: 200
            headerContains:
              x-cache: "HIT"
