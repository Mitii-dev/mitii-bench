id: "backend-token-revocation-list"
title: "OAuth2 Refresh Token Revocation List"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "ioredis"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "ioredis"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "logout"
  - contains:
      file: "src/index.js"
      text: "blacklist"
  - contains:
      file: "src/index.js"
      text: "TTL"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "POST"
          path: "/logout"
          json:
            jti: "abc"
            ttlSec: 120
          expect:
            status: 200
            jsonSubset:
              revoked: true
