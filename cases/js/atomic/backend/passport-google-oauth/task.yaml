id: "backend-passport-google-oauth"
title: "Passport.js OAuth2 Strategy Integration"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "passport"
  - "passport-google-oauth20"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "passport"
        - "passport-google-oauth20"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/auth/google.js"
      text: "GoogleStrategy"
  - contains:
      file: "src/auth/google.js"
      text: "/auth/google"
