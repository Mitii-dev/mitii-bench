id: "backend-articles-json-crud"
title: "Rest API CRUD with File Storage Backup"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "vanilla"
  - "smoke"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "articles"
  - contains:
      file: "src/index.js"
      text: "writeFile"
  - contains:
      file: "src/index.js"
      text: "rename"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "POST"
          path: "/articles"
          json:
            title: "Hello"
          expect:
            status: 201
            jsonPaths:
              - "id"
              - "title"
        - method: "GET"
          path: "/articles"
          expect:
            status: 200
            jsonType: "array"
