id: "backend-prometheus-metrics"
title: "Metrics Exporter for Prometheus"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "prom-client"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "prom-client"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "/metrics"
  - contains:
      file: "src/index.js"
      text: "prom-client"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "GET"
          path: "/metrics"
          expect:
            status: 200
            bodyContains: "process_cpu"
