id: "backend-nest-users-controller"
title: "NestJS Controller & Dependency Injection"
ecosystem: "js"
starter: "nest-js"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
  - "nestjs"
  - "smoke"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/users/users.controller.ts"
      text: "UsersController"
  - contains:
      file: "src/users/users.controller.ts"
      text: "UsersService"
  - contains:
      file: "src/users/users.controller.ts"
      text: "@Get"
  - contains:
      file: "src/users/users.controller.ts"
      text: "@Post"
  - http:
      start:
        command: "npm run start:dev"
      timeoutMs: 30000
      requests:
        - method: "GET"
          path: "/users"
          expect:
            status: 200
            jsonType: "array"
        - method: "POST"
          path: "/users"
          json:
            email: "new@example.com"
          headers:
            content-type: "application/json"
          expect:
            status: 201
            jsonSubset:
              email: "new@example.com"
