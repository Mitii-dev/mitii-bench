id: "backend-prisma-balance-transfer"
title: "Prisma ORM Transaction Handling"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "prisma"
  - "@prisma/client"
difficulty: "hard"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "prisma"
        - "@prisma/client"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/transferBalance.js"
      text: "$transaction"
  - contains:
      file: "src/transferBalance.js"
      text: "transferBalance"
