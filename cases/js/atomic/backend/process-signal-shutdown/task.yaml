id: "backend-process-signal-shutdown"
title: "Direct Process Signals Handling"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "core"
  - "vanilla"
  - "node-core"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/gracefulShutdown.js"
      text: "SIGINT"
  - contains:
      file: "src/gracefulShutdown.js"
      text: "SIGTERM"
