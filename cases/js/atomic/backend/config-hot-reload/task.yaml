id: "backend-config-hot-reload"
title: "Dynamic Config Reloading without Restart"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "config.json"
  - contains:
      file: "src/index.js"
      text: "watch"
  - contains:
      file: "src/index.js"
      text: "fs.watch"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "GET"
          path: "/config"
          expect:
            status: 200
            jsonType: "object"
