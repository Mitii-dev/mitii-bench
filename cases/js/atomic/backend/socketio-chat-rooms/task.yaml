id: "backend-socketio-chat-rooms"
title: "Socket.io Room Broadcasting"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "socket.io"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "socket.io"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/chat.js"
      text: "join-room"
  - contains:
      file: "src/chat.js"
      text: "send-message"
  - contains:
      file: "src/chat.js"
      text: "to("
