id: "backend-jwt-refresh-rotation"
title: "JWT Access & Refresh Token Rotation"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "jose"
difficulty: "hard"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "jose"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/tokens.js"
      text: "refresh"
  - contains:
      file: "src/tokens.js"
      text: "revoke"
