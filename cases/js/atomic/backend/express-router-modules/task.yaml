id: "backend-express-router-modules"
title: "Express Router Modularization"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/routes/products.js"
      text: "Router"
  - contains:
      file: "src/routes/products.js"
      text: "products"
  - contains:
      file: "src/routes/products.js"
      text: "orders"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 15000
      requests:
        - method: "GET"
          path: "/api/v1/products"
          expect:
            status: 200
            jsonPaths:
              - "items"
        - method: "GET"
          path: "/api/v1/orders"
          expect:
            status: 200
            jsonPaths:
              - "items"
