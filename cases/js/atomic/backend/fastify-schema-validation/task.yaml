id: "backend-fastify-schema-validation"
title: "Fastify Schema Validation & Hooks"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "fastify"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "fastify"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/server.js"
      text: "schema"
  - contains:
      file: "src/server.js"
      text: "POST"
  - contains:
      file: "src/server.js"
      text: "/items"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 15000
      requests:
        - method: "POST"
          path: "/items"
          json:
            name: "Widget"
            qty: 3
          expect:
            status: 200
            jsonSubset:
              name: "Widget"
              qty: 3
