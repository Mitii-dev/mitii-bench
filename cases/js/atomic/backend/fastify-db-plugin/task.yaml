id: "backend-fastify-db-plugin"
title: "Fastify Plugin Architecture"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "fastify"
  - "fastify-plugin"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "fastify"
        - "fastify-plugin"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/dbPlugin.js"
      text: "fastify-plugin"
  - contains:
      file: "src/dbPlugin.js"
      text: "decorate"
  - contains:
      file: "src/dbPlugin.js"
      text: "db"
