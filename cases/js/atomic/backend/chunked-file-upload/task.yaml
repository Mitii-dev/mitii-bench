id: "backend-chunked-file-upload"
title: "File Chunked Multipart Upload"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "hard"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "/upload/init"
  - contains:
      file: "src/index.js"
      text: "/upload/chunk"
  - contains:
      file: "src/index.js"
      text: "/upload/complete"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "POST"
          path: "/upload/init"
          json:
            name: "big.bin"
          expect:
            status: 200
            jsonPaths:
              - "uploadId"
