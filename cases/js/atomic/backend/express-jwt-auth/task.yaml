id: "backend-express-jwt-auth"
title: "Express JWT Authentication Middleware"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "jsonwebtoken"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "jsonwebtoken"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/authenticateToken.js"
      text: "authenticateToken"
  - contains:
      file: "src/authenticateToken.js"
      text: "jsonwebtoken"
  - contains:
      file: "src/authenticateToken.js"
      text: "401"
