id: "backend-mongoose-user-virtuals"
title: "Mongoose Schema & Virtuals"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "mongoose"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "mongoose"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/models/User.js"
      text: "fullName"
  - contains:
      file: "src/models/User.js"
      text: "virtual"
  - contains:
      file: "src/models/User.js"
      text: "mongoose"
