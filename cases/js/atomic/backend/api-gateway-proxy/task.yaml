id: "backend-api-gateway-proxy"
title: "Dynamic Proxy / API Gateway Route"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "http-proxy-middleware"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "http-proxy-middleware"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "/services/users"
  - contains:
      file: "src/index.js"
      text: "proxy"
  - http:
      start:
        command: "node src/index.js"
      sidecar:
        command: "node --input-type=module -e \"import http from 'node:http'; http.createServer((q,s)=>{s.writeHead(200,{'content-type':'application/json'});s.end(JSON.stringify({service:'users',path:q.url}))}).listen(Number(process.env.PORT))\""
        portEnv: "USER_SERVICE_PORT"
      timeoutMs: 20000
      requests:
        - method: "GET"
          path: "/services/users/1"
          expect:
            status: 200
            jsonSubset:
              service: "users"
