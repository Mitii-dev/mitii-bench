id: "backend-graphql-dataloader"
title: "GraphQL Dataloader for N+1 Queries"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "dataloader"
difficulty: "hard"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "dataloader"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/loaders/authorLoader.js"
      text: "DataLoader"
  - contains:
      file: "src/loaders/authorLoader.js"
      text: "load"
