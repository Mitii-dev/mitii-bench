id: "backend-nest-roles-guard"
title: "NestJS Custom Guard (RBAC)"
ecosystem: "js"
starter: "nest-js"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
  - "nestjs"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/auth/roles.guard.ts"
      text: "CanActivate"
  - contains:
      file: "src/auth/roles.guard.ts"
      text: "Roles"
  - contains:
      file: "src/auth/roles.guard.ts"
      text: "admin"
