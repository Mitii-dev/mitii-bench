id: "backend-apollo-user-query"
title: "Apollo Server Schema & Resolvers"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "@apollo/server"
  - "graphql"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "@apollo/server"
        - "graphql"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/graphql.js"
      text: "typeDefs"
  - contains:
      file: "src/graphql.js"
      text: "resolvers"
  - contains:
      file: "src/graphql.js"
      text: "user"
