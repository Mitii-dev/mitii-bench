id: "backend-db-seeder-script"
title: "DB Schema Seeder Script"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "@faker-js/faker"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "@faker-js/faker"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "faker"
  - contains:
      file: "src/index.js"
      text: "seed"
