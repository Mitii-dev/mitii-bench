id: "backend-microservice-shell"
title: "Complete Microservice Architecture Shell"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "pino"
  - "zod"
difficulty: "hard"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "pino"
        - "zod"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "pino"
  - contains:
      file: "src/index.js"
      text: "SIGTERM"
  - contains:
      file: "src/index.js"
      text: "/health/liveness"
  - contains:
      file: "src/index.js"
      text: "zod"
  - http:
      start:
        command: "node src/index.js"
        env:
          NODE_ENV: "test"
          DATABASE_URL: "sqlite://memory"
      timeoutMs: 20000
      requests:
        - method: "GET"
          path: "/health/liveness"
          expect:
            status: 200
            jsonSubset:
              alive: true
        - method: "GET"
          path: "/health/readiness"
          expect:
            status: 200
            jsonSubset:
              ready: true
