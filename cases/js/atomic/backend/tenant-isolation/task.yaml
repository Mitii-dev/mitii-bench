id: "backend-tenant-isolation"
title: "Tenant Isolation Middleware (Multi-Tenant App)"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "x-tenant-id"
  - contains:
      file: "src/index.js"
      text: "tenant"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "GET"
          path: "/items"
          headers:
            x-tenant-id: "acme"
          expect:
            status: 200
            jsonSubset:
              tenant: "acme"
