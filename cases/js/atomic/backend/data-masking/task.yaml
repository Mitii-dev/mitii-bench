id: "backend-data-masking"
title: "Data Masking & Anonymization Engine"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "vanilla"
  - "smoke"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/maskSensitive.js"
      text: "REDACTED"
  - contains:
      file: "src/maskSensitive.js"
      text: "ssn"
  - contains:
      file: "src/maskSensitive.js"
      text: "password"
