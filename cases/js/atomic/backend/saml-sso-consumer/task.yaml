id: "backend-saml-sso-consumer"
title: "Single Sign-On (SSO) SAML Identity Provider Consumer"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "passport-saml"
difficulty: "hard"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "passport-saml"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "SAML"
  - contains:
      file: "src/index.js"
      text: "Assertion"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "POST"
          path: "/auth/saml/acs"
          headers:
            content-type: "text/xml"
          expect:
            status: 401
