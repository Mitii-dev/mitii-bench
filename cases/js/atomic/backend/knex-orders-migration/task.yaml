id: "backend-knex-orders-migration"
title: "Knex.js Query Builder Migrations"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "knex"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "knex"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "migrations/001_orders.js"
      text: "orders"
  - contains:
      file: "migrations/001_orders.js"
      text: "exports.up"
  - contains:
      file: "migrations/001_orders.js"
      text: "exports.down"
