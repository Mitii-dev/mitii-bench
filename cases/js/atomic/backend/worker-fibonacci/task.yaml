id: "backend-worker-fibonacci"
title: "Worker Threads for Heavy Computation"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "hard"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "core"
  - "vanilla"
  - "node-core"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "Worker"
  - contains:
      file: "src/index.js"
      text: "fibonacci"
  - contains:
      file: "src/index.js"
      text: "worker_threads"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 15000
      requests:
        - method: "GET"
          path: "/health"
          expect:
            status: 200
            jsonSubset:
              status: "ok"
        - method: "GET"
          path: "/calculate-fibonacci?n=10"
          expect:
            status: 200
            jsonSubset:
              n: 10
              result: 55
