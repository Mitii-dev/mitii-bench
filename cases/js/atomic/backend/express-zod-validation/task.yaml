id: "backend-express-zod-validation"
title: "Express Request Validation with Joi/Zod"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "zod"
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
  - "smoke"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "zod"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "zod"
  - contains:
      file: "src/index.js"
      text: "/api/users"
  - contains:
      file: "src/index.js"
      text: "400"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 15000
      requests:
        - method: "POST"
          path: "/api/users"
          json:
            email: "user@example.com"
            age: 25
            password: "securepass"
          expect:
            status: 201
            jsonPaths:
              - "user.email"
        - method: "POST"
          path: "/api/users"
          json:
            email: "nope"
            age: 12
            password: "x"
          expect:
            status: 400
            jsonPaths:
              - "errors"
