id: "backend-csv-export-stream"
title: "CSV Export Pipeline"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "csv"
  - contains:
      file: "src/index.js"
      text: "pipe"
  - contains:
      file: "src/index.js"
      text: "stream"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "GET"
          path: "/export/users.csv"
          expect:
            status: 200
            headerContains:
              content-type: "text/csv"
            bodyContains: "User 1"
