id: "backend-storage-abstraction"
title: "File Storage Abstraction Layer (S3 vs Local)"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/storage.js"
      text: "LocalStorageProvider"
  - contains:
      file: "src/storage.js"
      text: "S3StorageProvider"
  - contains:
      file: "src/storage.js"
      text: "upload"
