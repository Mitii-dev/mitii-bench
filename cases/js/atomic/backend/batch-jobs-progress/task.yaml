id: "backend-batch-jobs-progress"
title: "Batch Processing Queue with Progress Updates"
ecosystem: "js"
starter: "node"
family: "api"
packages: []
difficulty: "medium"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "realworld"
  - "ecosystem-lib"
  - "vanilla"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/index.js"
      text: "/api/jobs"
  - contains:
      file: "src/index.js"
      text: "jobId"
  - contains:
      file: "src/index.js"
      text: "percentage"
  - http:
      start:
        command: "node src/index.js"
      timeoutMs: 20000
      requests:
        - method: "POST"
          path: "/api/jobs"
          json:
            items:
              - 1
              - 2
              - 3
              - 4
              - 5
          expect:
            status: 202
            jsonPaths:
              - "jobId"
