id: "backend-bullmq-email-queue"
title: "BullMQ Background Worker Queue"
ecosystem: "js"
starter: "node"
family: "api"
packages:
  - "bullmq"
  - "ioredis"
difficulty: "hard"
category: "backend"
language: "javascript"
tags:
  - "node-tasks"
  - "ecosystem"
  - "ecosystem-lib"
timeoutSec: 300
promptFile: "prompt.md"
readmeFile: "README.md"
checks:
  - build: true
  - package_deps:
      packages:
        - "bullmq"
        - "ioredis"
  - test:
      command: "MITII_NO_LISTEN=1 node --test tests/api.test.js"
      timeoutMs: 120000
  - contains:
      file: "src/emailQueue.js"
      text: "emailQueue"
  - contains:
      file: "src/emailQueue.js"
      text: "attempts"
  - contains:
      file: "src/emailQueue.js"
      text: "backoff"
